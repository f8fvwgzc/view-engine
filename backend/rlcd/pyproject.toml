[project]
name = "view-engine-rlcd"
version = "0.1.0"
description = "RLCD (Reinforcement Learning Calibrated Decision): typed decisions with calibrated probabilities for the View Engine (analysis tool, not financial advice)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.9.1",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "pydantic>=2.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
