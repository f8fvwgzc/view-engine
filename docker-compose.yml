# Infrastructure for View Engine. For the full research harness (Claude Code / Codex / Copilot CLIs on your
# own subscriptions) run the backend on the host: `make dev`. The `backend` and `frontend` services below are
# for container-only setups that use Ollama, an OpenAI-compatible server or the simulated provider.
name: view-engine

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: viewengine
      POSTGRES_USER: viewengine
      POSTGRES_PASSWORD: viewengine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viewengine -d viewengine"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - view-engine-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - view-engine-redis:/data

  backend:
    profiles: ["containers"]
    build: ./backend
    environment:
      DATABASE_URL: postgres://viewengine:viewengine@postgres:5432/viewengine
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-local-model}
      SKILLS_DIR: /app/skills
      BIND_ADDR: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3001"
    volumes:
      - ./skills:/app/skills

  frontend:
    profiles: ["containers"]
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:3001
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  view-engine-postgres:
  view-engine-redis:
