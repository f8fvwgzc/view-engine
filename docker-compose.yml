# Infrastructure for GodView Engine. For the full research harness (Claude Code / Codex / Copilot CLIs on your
# own subscriptions) run the backend on the host: `make dev`. The `backend` and `frontend` services below are
# for container-only setups that use Ollama, an OpenAI-compatible server or the simulated provider.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: godview
      POSTGRES_USER: godview
      POSTGRES_PASSWORD: godview
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godview -d godview"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - godview-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - godview-redis:/data

  backend:
    profiles: ["containers"]
    build: ./backend
    environment:
      DATABASE_URL: postgres://godview:godview@postgres:5432/godview
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-local-model}
      SKILLS_DIR: /app/skills
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3002:3001"

  frontend:
    profiles: ["containers"]
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:3001
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  godview-postgres:
  godview-redis:
